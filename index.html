<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Total vendido · CY-BX58D-8173</title>
<style>
:root{--green:#166534;--light:#f0fdf4;--line:#bbf7d0;--text:#17202a;--muted:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7f9;color:var(--text)}
.wrap{max-width:560px;margin:auto;padding:18px}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
h1{margin:0 0 6px;font-size:25px}.sub{color:var(--muted);margin-bottom:22px}
label{display:block;font-weight:700;margin-bottom:7px}
input{width:100%;font-size:18px;padding:13px;border:1px solid #cbd5e1;border-radius:12px}
.totalBox{margin-top:20px;padding:24px 16px;text-align:center;background:var(--light);border:2px solid var(--line);border-radius:18px}
.totalBox small{display:block;color:var(--green);font-weight:700;font-size:15px;margin-bottom:8px}
.total{font-size:44px;line-height:1;font-weight:800;color:var(--green)}
.count{margin-top:12px;color:var(--muted)}
.summaryCounter{margin-top:16px;padding:20px 16px;text-align:center;background:#eff6ff;border:2px solid #bfdbfe;border-radius:18px}
.summaryCounter small{display:block;color:#1d4ed8;font-weight:700;font-size:14px;margin-bottom:7px}.summaryNumber{font-size:40px;font-weight:800;color:#1d4ed8}.summaryDates{margin-top:10px;color:#334155;font-size:14px}.summaryDateRow{display:flex;justify-content:space-between;gap:12px;padding:7px 2px;border-top:1px solid #dbeafe}.summaryDateRow strong{color:#1e3a8a}
.printBtn{width:100%;margin-top:16px;border:0;border-radius:13px;padding:14px;background:var(--green);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.status{margin-top:18px;padding:11px;border-radius:12px;text-align:center;background:#f1f5f9;color:#475569}
.status.ok{background:#dcfce7;color:#166534}.status.error{background:#fee2e2;color:#991b1b}
.summaryBox{margin-top:18px;padding:16px;border:1px solid #dbe3ea;border-radius:16px;background:#f8fafc}
.summaryBox h2{margin:0 0 10px;font-size:18px}.summaryEmpty{color:var(--muted);font-size:14px;line-height:1.4}
.summaryItem{padding:11px 0;border-top:1px solid #e2e8f0}.summaryItem:first-of-type{border-top:0;padding-top:0}
.summaryTop{display:flex;justify-content:space-between;gap:12px;font-weight:700}.summaryMeta{margin-top:5px;color:var(--muted);font-size:13px}
.note{margin-top:16px;font-size:13px;line-height:1.45;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <h1>Control de impresiones retirado</h1>
    <div class="sub">La caja volvió a funcionar únicamente con el registro y la sincronización normal de ventas.</div>
    <a class="printBtn" style="display:block;text-align:center;text-decoration:none" href="https://cristiansaa25-create.github.io/caja-fonda-pache-pache/">Abrir caja</a>
  </section>
</main>
</body>
</html>
