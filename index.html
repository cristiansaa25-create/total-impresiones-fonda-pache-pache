<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de impresiones</title>
<style>:root{--g:#166534;--b:#1d4ed8;--m:#64748b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7f9;color:#17202a}.wrap{max-width:560px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 28px #0001}h1{margin:0 0 6px;font-size:25px}.sub{color:var(--m);margin-bottom:22px}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;font-size:18px;padding:13px;border:1px solid #cbd5e1;border-radius:12px}.box{margin-top:18px;padding:20px 16px;text-align:center;border:2px solid;border-radius:18px}.products{background:#f0fdf4;border-color:#bbf7d0}.summaries{background:#eff6ff;border-color:#bfdbfe}.box small{display:block;font-weight:700;margin-bottom:8px}.products small,.products .big{color:var(--g)}.summaries small,.summaries .big{color:var(--b)}.big{font-size:42px;font-weight:800}.detail{margin-top:9px;color:var(--m)}.rows{margin-top:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-top:1px solid #dbeafe}.status{margin-top:18px;padding:11px;border-radius:12px;text-align:center;background:#dcfce7;color:#166534}.note{margin-top:15px;color:var(--m);font-size:13px;line-height:1.45}</style></head>
<body><main class="wrap"><section class="card"><h1>Control de impresiones</h1><div class="sub">Separado del registro normal de ventas</div><label for="fecha">Seleccionar día</label><input id="fecha" type="date"><div class="box products"><small>BOLETAS DE PRODUCTOS IMPRESAS</small><div id="productTotal" class="big">$0</div><div id="productCount" class="detail">0 impresiones</div></div><div class="box summaries"><small>RESÚMENES DIARIOS IMPRESOS</small><div id="summaryCount" class="big">0</div><div id="summaryRows" class="rows"><div class="detail">Sin resúmenes registrados</div></div></div><div id="status" class="status">Conectando…</div><div class="note">Estos contadores son independientes. Las ventas y propinas solamente aumentan al pulsar “Registrar venta” en la caja.</div></section></main>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyBT8wjvd63jZYyPoCWnPnmzonkf1eWDiBQ",authDomain:"caja-pache-pache.firebaseapp.com",projectId:"caja-pache-pache",storageBucket:"caja-pache-pache.firebasestorage.app",messagingSenderId:"59192876859",appId:"1:59192876859:web:b184c5b3e63826bd50a11e",measurementId:"G-QH9ELJJ5NT"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();let current=[],legacy=[];const historicalSummaryDates=["2026-09-17","2026-09-18","2026-09-19"];
function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function money(n){return "$"+Math.round(Number(n)||0).toLocaleString("es-CL")}function recordTime(x){if(x.createdAt&&typeof x.createdAt.toDate==="function")return x.createdAt.toDate();const d=new Date(x.clientTime||0);return isNaN(d)?null:d}function normalized(){return current.concat(legacy.map(x=>({date:x.date,total:x.total,cash:x.cash,debit:x.debit,saleCount:x.saleCount,createdAt:x.createdAt,clientTime:x.clientTime,type:x.recordType==="daily_summary_print"?"daily_summary":"product_ticket"})))}
function render(){const day=document.getElementById("fecha").value,all=normalized(),products=all.filter(x=>x.date===day&&x.type==="product_ticket"),dates=new Set(historicalSummaryDates);all.filter(x=>x.type==="daily_summary"&&x.date).forEach(x=>dates.add(x.date));document.getElementById("productTotal").textContent=money(products.reduce((s,x)=>s+Number(x.total||0),0));document.getElementById("productCount").textContent=products.length+" impresión"+(products.length===1?"":"es");const ordered=[...dates].sort();document.getElementById("summaryCount").textContent=ordered.length;document.getElementById("summaryRows").innerHTML=ordered.map(date=>{const exact=all.filter(x=>x.type==="daily_summary"&&x.date===date).sort((a,b)=>(recordTime(b)?.getTime()||0)-(recordTime(a)?.getTime()||0))[0],prints=all.filter(x=>x.type==="product_ticket"&&x.date===date),sales=legacy.filter(x=>!x.recordType&&x.date===date),source=prints.length?prints:sales,total=exact?Number(exact.total||0):source.reduce((s,x)=>s+Number(x.total||0),0);return '<div class="row"><span>'+date.split("-").reverse().join("/")+'</span><strong>'+money(total)+'</strong></div>'}).join("")}
document.getElementById("fecha").value=todayKey();document.getElementById("fecha").addEventListener("change",render);let ready=0;function connected(){ready++;if(ready===2){document.getElementById("status").textContent="✓ Conectado · control separado de las ventas";render()}}db.collection("Impresiones").onSnapshot(s=>{current=s.docs.map(d=>({id:d.id,...d.data()}));connected()},e=>{console.error(e);document.getElementById("status").textContent="No se pudo leer el nuevo respaldo"});db.collection("Ventas").onSnapshot(s=>{legacy=s.docs.map(d=>({id:d.id,...d.data()}));connected()},e=>{console.error(e);document.getElementById("status").textContent="No se pudo recuperar el historial anterior"});
</script></body></html>
