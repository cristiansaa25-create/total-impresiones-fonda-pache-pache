<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Total vendido · CY-BX58D-8173</title>
<style>
:root{--green:#166534;--light:#f0fdf4;--line:#bbf7d0;--text:#17202a;--muted:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7f9;color:var(--text)}
.wrap{max-width:560px;margin:auto;padding:18px}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
h1{margin:0 0 6px;font-size:25px}.sub{color:var(--muted);margin-bottom:22px}
label{display:block;font-weight:700;margin-bottom:7px}
input{width:100%;font-size:18px;padding:13px;border:1px solid #cbd5e1;border-radius:12px}
.totalBox{margin-top:20px;padding:24px 16px;text-align:center;background:var(--light);border:2px solid var(--line);border-radius:18px}
.totalBox small{display:block;color:var(--green);font-weight:700;font-size:15px;margin-bottom:8px}
.total{font-size:44px;line-height:1;font-weight:800;color:var(--green)}
.count{margin-top:12px;color:var(--muted)}
.status{margin-top:18px;padding:11px;border-radius:12px;text-align:center;background:#f1f5f9;color:#475569}
.status.ok{background:#dcfce7;color:#166534}.status.error{background:#fee2e2;color:#991b1b}
.note{margin-top:16px;font-size:13px;line-height:1.45;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <h1>Total vendido</h1>
    <div class="sub">Impresiones realizadas desde todos los teléfonos</div>
    <label for="fecha">Seleccionar día</label>
    <input id="fecha" type="date">
    <div class="totalBox">
      <small>TOTAL ENVIADO A IMPRESIÓN</small>
      <div id="total" class="total">$0</div>
      <div id="count" class="count">0 boletas</div>
    </div>
    <div id="status" class="status">Conectando con Firebase…</div>
    <div class="note">El total aumenta cuando cualquier teléfono pulsa “Imprimir térmica Bluetooth” en la caja. Si se cancela después dentro de RawBT, la aplicación no puede detectarlo.</div>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBT8wjvd63jZYyPoCWnPnmzonkf1eWDiBQ",authDomain:"caja-pache-pache.firebaseapp.com",projectId:"caja-pache-pache",storageBucket:"caja-pache-pache.firebasestorage.app",messagingSenderId:"59192876859",appId:"1:59192876859:web:b184c5b3e63826bd50a11e",measurementId:"G-QH9ELJJ5NT"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const ventas=db.collection("Ventas");
let prints=[];
function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function money(n){return "$"+Math.round(Number(n)||0).toLocaleString("es-CL")}
function render(){
  const selected=document.getElementById("fecha").value;
  const rows=prints.filter(x=>x.date===selected);
  const sum=rows.reduce((a,x)=>a+Number(x.total||0),0);
  document.getElementById("total").textContent=money(sum);
  document.getElementById("count").textContent=rows.length+" boleta"+(rows.length===1?"":"s");
}
document.getElementById("fecha").value=todayKey();
document.getElementById("fecha").addEventListener("change",render);
ventas.onSnapshot(snapshot=>{
  prints=snapshot.docs.map(doc=>({id:doc.id,...doc.data()})).filter(x=>x.recordType==="device_print");
  const status=document.getElementById("status");
  status.textContent="✓ Conectado · "+prints.length+" impresiones sincronizadas";
  status.className="status ok";
  render();
},error=>{
  console.error(error);
  const status=document.getElementById("status");
  status.textContent="Error de conexión con Firebase";
  status.className="status error";
});
</script>
</body>
</html>
